name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build ad-hoc signed app
        run: bash build-app.sh
      - name: Verify and archive app
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/codesign --verify --strict --verbose=2 "dist/Herdr Bridge.app"
          arch="$(uname -m)"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent             "dist/Herdr Bridge.app" "dist/Herdr-Bridge-macos-$arch.zip"
      - name: Package disk image
        run: bash package-dmg.sh
      - name: Upload development app (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Herdr-Bridge-macos-${{ steps.archive.outputs.arch }}-${{ github.sha }}
          path: |
            dist/Herdr-Bridge-macos-*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
